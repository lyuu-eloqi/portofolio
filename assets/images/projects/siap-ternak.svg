<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F8FA"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#202938" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="400" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="638" height="398" rx="15" fill="none" stroke="#E5E9EF" stroke-width="2"/>

  <!-- Browser Window Wrapper -->
  <g transform="translate(30, 24)">
    <!-- Window Header -->
    <rect width="580" height="352" rx="12" fill="#FFFFFF" filter="url(#cardShadow)" stroke="#E5E9EF" stroke-width="1.2"/>
    <rect width="580" height="38" rx="12" fill="#EEF2F6"/>
    <rect y="26" width="580" height="12" fill="#EEF2F6"/>
    <line x1="0" y1="38" x2="580" y2="38" stroke="#E5E9EF" stroke-width="1.2"/>

    <!-- Window Dots -->
    <circle cx="20" cy="19" r="4.5" fill="#E5E9EF"/>
    <circle cx="36" cy="19" r="4.5" fill="#CBD5E1"/>
    <circle cx="52" cy="19" r="4.5" fill="#94A3B8"/>

    <!-- Address Bar -->
    <rect x="74" y="9" width="320" height="20" rx="6" fill="#FFFFFF" stroke="#E5E9EF" stroke-width="1"/>
    <text x="86" y="23" font-family="'Poppins', sans-serif" font-size="9" fill="#687386">siap-ternak.app/analytics-dashboard</text>

    <!-- Project Badge -->
    <rect x="440" y="9" width="124" height="20" rx="6" fill="#526B82"/>
    <text x="502" y="23" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">LARAVEL + VUE.JS</text>

    <!-- Dashboard Content -->
    <!-- Sidebar -->
    <rect x="0" y="38" width="130" height="314" fill="#F8FAFC"/>
    <line x1="130" y1="38" x2="130" y2="352" stroke="#E5E9EF" stroke-width="1"/>

    <!-- Sidebar menu items -->
    <g transform="translate(12, 54)">
      <rect width="106" height="26" rx="6" fill="#526B82" opacity="0.12"/>
      <rect x="8" y="7" width="12" height="12" rx="3" fill="#526B82"/>
      <text x="28" y="17" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" fill="#202938">Ringkasan</text>

      <g transform="translate(0, 36)">
        <rect x="8" y="7" width="12" height="12" rx="3" fill="#CBD5E1"/>
        <text x="28" y="17" font-family="'Poppins', sans-serif" font-size="9.5" fill="#687386">Prediksi Bobot</text>
      </g>
      <g transform="translate(0, 68)">
        <rect x="8" y="7" width="12" height="12" rx="3" fill="#CBD5E1"/>
        <text x="28" y="17" font-family="'Poppins', sans-serif" font-size="9.5" fill="#687386">Analisis Laba</text>
      </g>
      <g transform="translate(0, 100)">
        <rect x="8" y="7" width="12" height="12" rx="3" fill="#CBD5E1"/>
        <text x="28" y="17" font-family="'Poppins', sans-serif" font-size="9.5" fill="#687386">Simulasi Data</text>
      </g>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(146, 52)">
      <!-- Title -->
      <text x="0" y="14" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#202938">Dashboard Analitik Cerdas SIAP-TERNAK</text>
      <text x="0" y="28" font-family="'Poppins', sans-serif" font-size="9.5" fill="#687386">Linear Regression &amp; Moving Average (Simulasi Siklus 35 Hari)</text>

      <!-- KPI Metric Cards -->
      <g transform="translate(0, 40)">
        <!-- Card 1 -->
        <rect width="130" height="58" rx="8" fill="#F8FAFC" stroke="#E5E9EF" stroke-width="1"/>
        <text x="10" y="18" font-family="'Poppins', sans-serif" font-size="8.5" fill="#687386">Estimasi Laba Periode</text>
        <text x="10" y="38" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#202938">Rp 14.850.000</text>
        <text x="10" y="50" font-family="'Poppins', sans-serif" font-size="7.5" fill="#526B82">Proyeksi Model Simulasi</text>

        <!-- Card 2 -->
        <g transform="translate(142, 0)">
          <rect width="130" height="58" rx="8" fill="#F8FAFC" stroke="#E5E9EF" stroke-width="1"/>
          <text x="10" y="18" font-family="'Poppins', sans-serif" font-size="8.5" fill="#687386">Skor Akurasi MAPE</text>
          <text x="10" y="38" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#526B82">4.82%</text>
          <text x="10" y="50" font-family="'Poppins', sans-serif" font-size="7.5" fill="#10B981">Tingkat Galat Rendah</text>
        </g>

        <!-- Card 3 (Early Warning) -->
        <g transform="translate(284, 0)">
          <rect width="136" height="58" rx="8" fill="#F8FAFC" stroke="#E5E9EF" stroke-width="1"/>
          <text x="10" y="18" font-family="'Poppins', sans-serif" font-size="8.5" fill="#687386">Status Early Warning</text>
          <text x="10" y="38" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#202938">Normal / Terkendali</text>
          <text x="10" y="50" font-family="'Poppins', sans-serif" font-size="7.5" fill="#687386">Rasio Pakan Terjaga</text>
        </g>
      </g>

      <!-- Prediction Chart Mockup -->
      <g transform="translate(0, 110)">
        <rect width="420" height="136" rx="8" fill="#FFFFFF" stroke="#E5E9EF" stroke-width="1"/>
        
        <!-- Grid lines inside chart -->
        <line x1="20" y1="30" x2="400" y2="30" stroke="#F1F5F9" stroke-width="1"/>
        <line x1="20" y1="60" x2="400" y2="60" stroke="#F1F5F9" stroke-width="1"/>
        <line x1="20" y1="90" x2="400" y2="90" stroke="#F1F5F9" stroke-width="1"/>
        <line x1="20" y1="116" x2="400" y2="116" stroke="#E2E8F0" stroke-width="1"/>

        <!-- Chart Legend -->
        <circle cx="30" cy="16" r="3.5" fill="#526B82"/>
        <text x="40" y="19" font-family="'Poppins', sans-serif" font-size="8" fill="#202938">Moving Average</text>
        <circle cx="130" cy="16" r="3.5" fill="#94A3B8"/>
        <text x="140" y="19" font-family="'Poppins', sans-serif" font-size="8" fill="#687386">Linear Regression</text>

        <!-- Prediction Curves -->
        <!-- Linear Regression line (dotted) -->
        <line x1="30" y1="104" x2="390" y2="38" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,4"/>

        <!-- Moving Average curve -->
        <path d="M 30 110 Q 90 98, 140 86 T 230 68 T 320 50 T 390 40" fill="none" stroke="#526B82" stroke-width="2.5"/>

        <!-- Data points -->
        <circle cx="30" cy="110" r="3.5" fill="#526B82" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="140" cy="86" r="3.5" fill="#526B82" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="230" cy="68" r="3.5" fill="#526B82" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="320" cy="50" r="3.5" fill="#526B82" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="390" cy="40" r="4.5" fill="#202938" stroke="#FFFFFF" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>
